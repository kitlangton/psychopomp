[package]
name = "psychopomp-render"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "psychopomp_render"
path = "src/lib.rs"

[[bin]]
name = "psychopomp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
psychopomp = { path = "../psychopomp" }
pollster = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
png = "0.18"
resvg = { version = "0.47", default-features = false }
rune = { workspace = true, default-features = false, features = ["svg"] }
rune-kit = { workspace = true }
rune-theme-opencode = { workspace = true }
image-webp = "0.2"
zune-jpeg = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = { version = "~30.0.1", features = ["naga-ir"] }
winit = "0.30"

[dev-dependencies]
psychopomp-opencode-session-tool = { path = "../../scenes/opencode-session-tool" }
psychopomp-hero = { path = "../../scenes/hero" }
psychopomp-effect-succeed-slides = { path = "../../scenes/effect-succeed-slides" }
psychopomp-interactive-showcase = { path = "../../scenes/interactive-showcase" }
psychopomp-keyed-grid = { path = "../../scenes/keyed-grid" }
psychopomp-data-modeling = { path = "../../scenes/data-modeling" }
psychopomp-component-prototypes = { path = "../../scenes/component-prototypes" }

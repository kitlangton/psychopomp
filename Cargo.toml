[workspace]
members = ["crates/*", "scenes/*"]
default-members = ["crates/psychopomp-render"]
resolver = "3"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "5dad9547" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "5dad9547", features = ["markdown", "mermaid"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "5dad9547" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "5dad9547" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "5dad9547" }

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[workspace]
members = ["crates/*", "scenes/*"]
default-members = ["crates/psychopomp-render"]
resolver = "3"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "ad605f9c" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ad605f9c", features = ["markdown", "mermaid"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "ad605f9c" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "ad605f9c" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "ad605f9c" }

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true
